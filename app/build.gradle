plugins {
    id 'com.android.application'
}

android {
    namespace 'home.tvphotos'
    compileSdk 34

    defaultConfig {
        applicationId 'home.tvphotos'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '1.8.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB, never published: signed with this Mac's debug key, like the launcher.
            // Keep ~/.android/debug.keystore, or a later build will not install over this one.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
